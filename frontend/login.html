<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Portfolio Optimizer</title>
    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <!-- Styles -->
    <link rel="stylesheet" href="styles/main.css">
    <!-- Background Animation Styles (login page only) -->
    <style>
        /* Background container - purely decorative, non-interactive */
        #bg-animation {
            position: fixed;
            inset: 0;
            z-index: 0;
            pointer-events: none;
            overflow: hidden;
        }

        #bg-animation svg {
            width: 100%;
            height: 100%;
        }

        .bg-path {
            fill: none;
            stroke: var(--accent-color, #3b82f6);
            stroke-linecap: round;
            animation: pathFlow var(--duration) ease-in-out infinite;
            animation-delay: var(--delay);
        }

        @keyframes pathFlow {
            0% {
                stroke-dashoffset: 1000;
                opacity: 0.1;
            }

            50% {
                stroke-dashoffset: 0;
                opacity: 0.4;
            }

            100% {
                stroke-dashoffset: -1000;
                opacity: 0.1;
            }
        }

        /* Ensure login container is above background */
        .auth-container {
            position: relative;
            z-index: 10;
        }

        /* Glassmorphism styling for login card */
        .auth-card {
            background: rgba(30, 41, 59, 0.65) !important;
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.1) !important;
            box-shadow:
                0 8px 32px rgba(0, 0, 0, 0.3),
                inset 0 1px 0 rgba(255, 255, 255, 0.05);
            border-radius: 16px !important;
        }

        /* Light theme glassmorphism */
        [data-theme="light"] .auth-card {
            background: rgba(255, 255, 255, 0.65) !important;
            border: 1px solid rgba(0, 0, 0, 0.08) !important;
            box-shadow:
                0 8px 32px rgba(0, 0, 0, 0.1),
                inset 0 1px 0 rgba(255, 255, 255, 0.5);
        }
    </style>
</head>

<body class="auth-body">

    <div class="auth-container">
        <div class="auth-card">
            <div class="auth-header">
                <h2>Welcome Back</h2>
                <p>Sign in to access the active portfolio dashboard</p>
            </div>

            <form id="login-form">
                <div class="form-group">
                    <label for="email">Email Address</label>
                    <input type="email" id="email" name="email" placeholder="name@company.com" required>
                </div>

                <div class="form-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" name="password" placeholder="••••••••" required>
                </div>

                <div id="error-msg" class="error-message hidden">Invalid email or password</div>

                <button type="submit" class="btn btn-primary btn-block">Sign In</button>
            </form>

            <div class="demo-credentials">
                <p>Demo Credentials:</p>
                <div class="demo-row">
                    <span>Admin:</span> <code>user@finance.com</code> / <code>password123</code>
                </div>
                <div class="demo-row">
                    <span>Analyst:</span> <code>analyst@finance.com</code> / <code>password123</code>
                </div>
            </div>
        </div>
    </div>

    <script type="module">
        import { AuthManager } from './js/auth.js';

        document.getElementById('login-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const errorMsg = document.getElementById('error-msg');

            errorMsg.classList.add('hidden');

            const res = await AuthManager.login(email, password);

            if (res.status === 'success') {
                window.location.href = '/dashboard';
            } else {
                errorMsg.textContent = res.message || 'Login failed';
                errorMsg.classList.remove('hidden');
            }
        });
    </script>

    <!-- Background Animation Script (purely visual, non-interactive) -->
    <script>
        (function () {
            const container = document.createElement('div');
            container.id = 'bg-animation';

            const svg = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
            svg.setAttribute('viewBox', '0 0 1920 1080');
            svg.setAttribute('preserveAspectRatio', 'xMidYMid slice');

            // Generate 24 flowing paths
            for (let i = 0; i < 24; i++) {
                const path = document.createElementNS('http://www.w3.org/2000/svg', 'path');
                const yBase = 50 + (i * 40);
                const amplitude = 80 + Math.random() * 60;

                // Create smooth bezier curve
                const d = `M-100 ${yBase} ` +
                    `Q480 ${yBase - amplitude}, 960 ${yBase} ` +
                    `T2020 ${yBase + amplitude * 0.5}`;

                path.setAttribute('d', d);
                path.setAttribute('class', 'bg-path');
                path.setAttribute('stroke-width', (0.5 + Math.random() * 1.5).toFixed(2));
                path.setAttribute('stroke-dasharray', '500 1000');
                path.style.setProperty('--delay', `${i * 0.3}s`);
                path.style.setProperty('--duration', `${15 + Math.random() * 15}s`);
                path.style.opacity = 0.1 + (i * 0.015);

                svg.appendChild(path);
            }

            container.appendChild(svg);
            document.body.insertBefore(container, document.body.firstChild);
        })();
    </script>
</body>

</html>
